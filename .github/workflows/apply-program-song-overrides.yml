name: Apply Program Song Overrides

on:
  push:
    branches:
      - feature/program-song-overrides
    paths:
      - .github/apply-program-song-overrides.cjs

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/program-song-overrides
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integration edits
        run: node .github/apply-program-song-overrides.cjs
      - name: Remove one-time integration files
        run: |
          rm .github/apply-program-song-overrides.cjs
          rm .github/workflows/apply-program-song-overrides.yml
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "jhaago"
          git config user.email "jordanhaagensen@gmail.com"
          git add -A
          git commit -m "Add per-program song overrides"
          git push origin HEAD:feature/program-song-overrides
