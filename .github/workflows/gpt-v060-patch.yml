name: Apply v0.6 Patch

on:
  push:
    branches:
      - gpt-v060
    paths:
      - scripts/gpt-v060-patch.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply v0.6 patch
        run: node scripts/gpt-v060-patch.mjs

      - name: Validate source build
        run: npm install && npm run build

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add v0.6 Bible timers and messages"
          git push origin HEAD:gpt-v060
